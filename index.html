<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Catalogador de Gibis</title>

    <!-- CSS Principal -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Bibliotecas Externas (PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="container">

        <!-- Cabeçalho / Barra do Usuário -->
        <header class="user-header no-pdf">
            <span id="userGreeting">Usuário: Carregando...</span>
            <button type="button" class="btn-logout" onclick="window.logout ? window.logout() : null">Sair</button>
        </header>

        <!-- Título do Aplicativo -->
        <div class="app-title">
            <h1>📚 MEU CATALOGADOR DE GIBIS</h1>
        </div>

        <!-- Barra de Controles (Ações da Lista e Submenu de Opções) -->
        <div class="controls no-pdf">
            <div class="main-controls">
                <label for="sheetSelect"><strong>Personagem:</strong></label>
                <select id="sheetSelect" onchange="window.changeSheet ? window.changeSheet() : null"></select>

                <button type="button" class="btn-action" onclick="window.createNewSheet ? window.createNewSheet() : null">+ Nova Lista</button>
                <button type="button" class="btn-delete-sheet" onclick="window.deleteCurrentSheet ? window.deleteCurrentSheet() : null">Excluir Lista</button>
            </div>

            <!-- Submenu de Opções (Backup e Exportar PDF) -->
            <div class="settings-dropdown">
                <button type="button" class="btn-settings" onclick="toggleSettingsMenu(event)">⚙️ Opções ▾</button>

                <div id="settingsMenu" class="dropdown-content">
                    <button type="button" class="btn-menu-item" onclick="if(window.exportarBackup) window.exportarBackup(); closeSettingsMenu();">💾 Baixar Backup</button>

                    <label class="btn-menu-item">
                        📂 Restaurar Backup
                        <input type="file" id="importInput" onchange="if(window.importarBackup) window.importarBackup(event); closeSettingsMenu();" accept=".json" hidden>
                    </label>

                    <button type="button" class="btn-menu-item" onclick="if(window.exportToPDF) window.exportToPDF(); closeSettingsMenu();">📄 Exportar PDF</button>
                </div>
            </div>
        </div>

        <!-- Formulário para Adicionar Novo Gibi -->
        <form id="gibiForm" class="gibi-form no-pdf" onsubmit="if(window.addGibi) window.addGibi(event);">
            <div class="form-grid">
                <input type="text" id="editora" placeholder="Editora (ex: Abril)" required>
                <input type="text" id="categoria" placeholder="Categoria (ex: Almanaque)">
                <input type="text" id="serieFase" placeholder="Série/Fase (ex: 1ª Série)">
                <input type="number" id="numero" placeholder="Número (ex: 1)" required>
                <input type="text" id="dataPublicacao" placeholder="Mês/Ano (ex: Jan/1980)">
                <input type="text" id="estado" placeholder="Estado (ex: Bom)">
            </div>

            <div class="form-file-row">
                <label for="capa" class="file-label">Imagem da Capa (Opcional):</label>
                <input type="file" id="capa" accept="image/*">
            </div>

            <button type="submit" class="btn-add">+ Adicionar À Lista</button>
        </form>

        <!-- Título da Coleção Atual -->
        <div class="collection-header">
            <h2 id="currentCollectionTitle">COLEÇÃO: SELECIONE UM PERSONAGEM</h2>
        </div>

        <!-- Filtros e Busca -->
        <div class="filter-bar no-pdf">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Buscar por personagem, editora, nº..." oninput="if(window.filterTable) window.filterTable();">
            </div>
            <div class="category-filter">
                <label for="categoryFilter">📂 Filtrar por Categoria:</label>
                <select id="categoryFilter" onchange="if(window.filterTable) window.filterTable();">
                    <option value="">Todas as Categorias</option>
                </select>
            </div>
        </div>

        <!-- Tabela de Gibis Catalogados -->
        <div class="table-responsive">
            <table id="gibiTable">
                <thead>
                    <tr>
                        <th>CAPA</th>
                        <th>PERSONAGEM</th>
                        <th>Nº</th>
                        <th>EDITORA</th>
                        <th>CATEGORIA</th>
                        <th>SÉRIE/FASE</th>
                        <th>DATA</th>
                        <th>ESTADO</th>
                        <th class="no-pdf actions-cell">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="gibiTableBody">
                    <!-- Linhas geradas dinamicamente pelo JavaScript -->
                </tbody>
            </table>
        </div>

    </div>

    <!-- Controle do Submenu Dropdown -->
    <script>
        function toggleSettingsMenu(event) {
            if (event) event.stopPropagation();
            var menu = document.getElementById('settingsMenu');
            if (menu) menu.classList.toggle('show');
        }

        function closeSettingsMenu() {
            var menu = document.getElementById('settingsMenu');
            if (menu) menu.classList.remove('show');
        }

        window.addEventListener('click', function(e) {
            var menu = document.getElementById('settingsMenu');
            if (menu && !e.target.matches('.btn-settings')) {
                menu.classList.remove('show');
            }
        });
    </script>

    <!-- Script Principal como Módulo -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
