<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coleção de Gibis</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input, button { padding: 8px; font-size: 16px; }
    .gibi-card { border: 1px solid #ccc; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>Minha Coleção de Gibis</h1>

  <!-- FORMULÁRIO PARA INSERIR GIBIS -->
  <form id="form-gibi">
    <input type="text" id="input-titulo" placeholder="Título do Gibi" required>
    <input type="number" id="input-numero" placeholder="Número da Edição" required>
    <button type="submit">Salvar Gibi</button>
  </form>

  <hr>

  <!-- CONTAINER ONDE OS GIBIS FICARÃO SALVOS NA TELA -->
  <h2>Gibis Cadastrados</h2>
  <div id="lista-gibis">
    <p>Carregando gibis...</p>
  </div>

  <!-- SCRIPT DO FIREBASE DENTRO DO PRÓPRIO HTML (OBLIGATÓRIO: type="module") -->
  <script type="module">
    // 1. IMPORTAÇÕES DO FIREBASE (Firestore CDN)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 2. SUAS CREDENCIAIS DO FIREBASE (Substitua pelos dados do seu projeto)
    const firebaseConfig = {
		apiKey: "AIzaSyCp1T_3QhVTTE7zd8v-X50dTpP-jHzOUek",
		authDomain: "gibis-da-bibi.firebaseapp.com",
		projectId: "gibis-da-bibi",
		storageBucket: "gibis-da-bibi.firebasestorage.app",
		messagingSenderId: "1069619452025",
		appId: "1:1069619452025:web:82d0743ae68029df595ca8"
	};

    // Inicializa o Firebase e o Banco Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const formGibi = document.getElementById("form-gibi");
    const listaGibisContainer = document.getElementById("lista-gibis");

    // 3. LEITURA EM TEMPO REAL (Garante que os dados permanecem ao dar refresh)
    // O 'onSnapshot' busca no Firestore e atualiza o HTML automaticamente
    onSnapshot(collection(db, "gibis"), (snapshot) => {
      listaGibisContainer.innerHTML = ""; // Limpa antes de reescrever

      if (snapshot.empty) {
        listaGibisContainer.innerHTML = "<p>Nenhum gibi encontrado.</p>";
        return;
      }

      snapshot.forEach((doc) => {
        const gibi = doc.data();
        listaGibisContainer.innerHTML += `
          <div class="gibi-card">
            <h3>${gibi.titulo}</h3>
            <p><strong>Edição:</strong> #${gibi.numero}</p>
          </div>
        `;
      });
    });

    // 4. SALVANDO O GIBI NO BANCO DE DADOS
    formGibi.addEventListener("submit", async (event) => {
      // e.preventDefault() EVITA o refresh do navegador que limpava os dados!
      event.preventDefault(); 

      const titulo = document.getElementById("input-titulo").value;
      const numero = document.getElementById("input-numero").value;

      try {
        await addDoc(collection(db, "gibis"), {
          titulo: titulo,
          numero: numero,
          criadoEm: new Date()
        });

        formGibi.reset(); // Limpa os campos do formulário após salvar
      } catch (error) {
        console.error("Erro ao salvar no Firebase:", error);
        alert("Erro ao salvar. Verifique o console.");
      }
    });
  </script>

</body>
</html>
