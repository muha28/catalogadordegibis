<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogador de Gibis Premium</title>
    <!-- Bibliotecas externas para exportação em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --primary: #2E4057; 
            --accent: #e63946; 
            --bg-page: #f4f7f9; 
            --bg-panel: rgba(255, 255, 255, 0.96); 
            --text: #1d3557;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out; 
            margin: 0; 
            padding: 20px; 
            color: var(--text); 
            background-color: var(--bg-page);
        }

        h1, h2 { 
            font-family: 'Bangers', cursive, 'Segoe UI', sans-serif; 
            letter-spacing: 1px; 
        }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            background: var(--bg-panel); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            border: 2px solid var(--primary); 
        }

        h1 { 
            color: var(--primary); 
            margin-top: 0; 
            text-align: center; 
            font-size: 2.2em; 
            text-transform: uppercase; 
        }

        .controls { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
            align-items: center; 
            background: rgba(233, 236, 239, 0.85); 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
        }

        select, input, button { 
            padding: 8px 10px; 
            border: 2px solid #ccc; 
            border-radius: 6px; 
            font-size: 14px; 
            font-family: 'Segoe UI', sans-serif; 
        }

        input:focus, select:focus { 
            border-color: var(--accent); 
            outline: none; 
        }

        button { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: uppercase; 
            font-weight: bold; 
        }

        button:hover { 
            background-color: var(--text); 
            transform: translateY(-1px); 
        } 
        
        .btn-pdf { background-color: #28a745; margin-left: auto; } 
        .btn-pdf:hover { background-color: #218838; }
        .btn-delete-sheet { background-color: #dc3545; }
        .btn-delete-sheet:hover { background-color: #a71d2a; }

        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
            gap: 10px; 
            margin-bottom: 20px; 
            background: rgba(248, 249, 250, 0.95); 
            padding: 18px; 
            border-radius: 8px; 
            border: 2px solid var(--primary); 
            align-items: center;
        }

        .file-wrapper {
            grid-column: span 2;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .form-submit-btn {
            grid-column: 1 / -1; 
            background-color: var(--accent);
            font-size: 15px;
            padding: 12px;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 12px;
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
        }

        .filter-bar label {
            font-weight: bold;
            font-size: 14px;
            color: var(--primary);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 6px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white; 
            min-width: 750px;
        }

        th, td { 
            border: 1px solid #dee2e6; 
            padding: 8px 10px; 
            text-align: left; 
            vertical-align: middle;
        }

        /* Estilo para inputs de edição dentro da tabela */
        td input[type="text"], td input[type="number"] {
            width: 100%;
            padding: 4px 6px;
            font-size: 13px;
        }
        
        th { 
            background-color: var(--primary); 
            color: white; 
            text-transform: uppercase; 
            font-size: 0.85em; 
            white-space: nowrap;
        }

        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e9ecef; }

        .capa-cell {
            text-align: center;
            width: 60px;
        }

        .capa-thumb {
            width: 48px;
            height: 68px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            display: block;
            margin: 0 auto;
            background-color: #e9ecef;
        }

        .capa-placeholder {
            width: 48px;
            height: 68px;
            border-radius: 4px;
            border: 1px dashed #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #888;
            margin: 0 auto;
            text-align: center;
        }

        .numero-cell { 
            font-weight: bold; 
            color: var(--accent); 
            font-size: 1.05em; 
            white-space: nowrap;
        } 
        
        .actions-cell { 
            text-align: center; 
            white-space: nowrap;
        }

        .btn-edit {
            background: #ffc107;
            color: #212529;
            padding: 6px 10px;
            font-size: 12px;
            text-transform: none;
            margin-right: 4px;
        }
        .btn-edit:hover { background: #e0a800; }

        .btn-save {
            background: #28a745;
            padding: 6px 10px;
            font-size: 12px;
            text-transform: none;
            margin-right: 4px;
        }
        .btn-save:hover { background: #218838; }

        .btn-cancel {
            background: #6c757d;
            padding: 6px 10px;
            font-size: 12px;
            text-transform: none;
        }
        .btn-cancel:hover { background: #5a6268; }

        .btn-delete { 
            background: #dc3545; 
            padding: 6px 10px; 
            font-size: 12px; 
            text-transform: none;
        }
        .btn-delete:hover { background: #a71d2a; }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .container { padding: 12px; }
            h1 { font-size: 1.7em; }
            .controls { flex-direction: column; align-items: stretch; gap: 8px; }
            .controls label { text-align: center; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .btn-pdf { margin-left: 0; }
            .form-grid { grid-template-columns: 1fr; }
            .file-wrapper { grid-column: 1 / -1; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>📚 Meu Catalogador de Gibis</h1>

    <div class="controls">
        <label for="sheetSelect"><strong>Personagem:</strong></label>
        <select id="sheetSelect" onchange="changeSheet()"></select>
        <button onclick="createNewSheet()">+ Nova Lista</button>
        <button class="btn-delete-sheet" onclick="deleteCurrentSheet()">🗑️ Excluir Lista</button>
        <button class="btn-pdf" onclick="exportToPDF()">📄 Exportar PDF</button>
    </div>

    <!-- Formulário -->
    <form id="addGibiForm" onsubmit="addGibi(event)">
        <div class="form-grid">
            <input type="text" id="editora" placeholder="Editora (ex: Abril)" required>
            <input type="text" id="categoria" placeholder="Categoria (ex: Almanaque)" required>
            <input type="text" id="serie" placeholder="Série/Fase (ex: 1ª Série)" required>
            <input type="number" id="numero" placeholder="Número (ex: 1)" required>
            <input type="text" id="data" placeholder="Mês/Ano (ex: Jan/1987)">
            <input type="text" id="estado" placeholder="Estado (ex: Bom)">
            
            <div class="file-wrapper">
                <label for="capaInput">Imagem da Capa (Opcional):</label>
                <input type="file" id="capaInput" accept="image/*">
            </div>

            <button type="submit" class="form-submit-btn">+ Adicionar À Lista</button>
        </div>
    </form>

    <div id="pdfContent">
        <h2 id="currentSheetTitle" style="color: var(--primary); text-align: center; margin-bottom: 12px;"></h2>
        
        <!-- Filtro de Categoria -->
        <div class="filter-bar no-pdf">
            <label for="categoryFilter">🔍 Filtrar por Categoria:</label>
            <select id="categoryFilter" onchange="renderTable()">
                <option value="TODAS">Todas as Categorias</option>
            </select>
        </div>

        <div class="table-responsive">
            <table id="gibiTable">
                <thead>
                    <tr>
                        <th class="capa-cell">Capa</th>
                        <th>Nº</th>
                        <th>Editora</th>
                        <th>Categoria</th>
                        <th>Série/Fase</th>
                        <th>Data</th>
                        <th>Estado</th>
                        <th class="actions-cell no-pdf">Ações</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let fundosPersonagens = JSON.parse(localStorage.getItem('gibisFundos_v3')) || {
        "Chico Bento": "./imagens/chico-bento.jpg",
        "default": ""
    };

    let database = JSON.parse(localStorage.getItem('gibisDB_v3')) || {
        "Chico Bento": [
            { capa: "", editora: "Panini", categoria: "Almanaque", serie: "1ª Série", numero: 56, data: "Abril 2016", estado: "Bom" },
            { capa: "", editora: "Panini", categoria: "Gibi Mensal", serie: "1ª Série", numero: 78, data: "Dezembro 2019", estado: "Bom" },
            { capa: "", editora: "Panini", categoria: "Edição Especial", serie: "1ª Série", numero: 80, data: "Abril 2020", estado: "Bom" }
        ]
    };

    let currentSheet = Object.keys(database)[0] || "Chico Bento";
    let editingIndex = null; // Armazena o índice do item em edição

    function saveData() { 
        localStorage.setItem('gibisDB_v3', JSON.stringify(database)); 
        localStorage.setItem('gibisFundos_v3', JSON.stringify(fundosPersonagens)); 
    }

    function aplicarFundo() {
        const urlImagem = fundosPersonagens[currentSheet] || fundosPersonagens["default"];
        if (urlImagem) {
            document.body.style.backgroundImage = `url('${urlImagem}')`;
        } else {
            document.body.style.backgroundImage = 'none';
        }
    }

    function init() { 
        const sheets = Object.keys(database);
        if (sheets.length === 0) {
            database["Minha Coleção"] = [];
            currentSheet = "Minha Coleção";
            saveData();
        }
        editingIndex = null;
        updateSheetDropdown(); 
        updateCategoryFilterOptions();
        renderTable(); 
        aplicarFundo();
    }

    function updateSheetDropdown() {
        const select = document.getElementById('sheetSelect');
        select.innerHTML = '';
        
        const sortedSheets = Object.keys(database).sort((a, b) => 
            a.localeCompare(b, 'pt-BR', { sensitivity: 'base' })
        );

        sortedSheets.forEach(sheet => {
            const option = document.createElement('option');
            option.value = sheet; 
            option.textContent = sheet;
            if (sheet === currentSheet) option.selected = true;
            select.appendChild(option);
        });

        document.getElementById('currentSheetTitle').innerText = "COLEÇÃO: " + currentSheet.toUpperCase();
    }

    function updateCategoryFilterOptions() {
        const filterSelect = document.getElementById('categoryFilter');
        const selectedValue = filterSelect.value;
        filterSelect.innerHTML = '<option value="TODAS">Todas as Categorias</option>';

        if (!database[currentSheet]) return;

        const categorias = [...new Set(database[currentSheet].map(item => item.categoria.trim()))]
            .filter(Boolean)
            .sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));

        categorias.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            filterSelect.appendChild(option);
        });

        if (categorias.includes(selectedValue)) {
            filterSelect.value = selectedValue;
        } else {
            filterSelect.value = "TODAS";
        }
    }

    function createNewSheet() {
        const name = prompt("Nome do Personagem/Lista:");
        if (name && !database[name]) {
            database[name] = []; 
            currentSheet = name;
            saveData(); 
            init();
        } else if (database[name]) { 
            alert("Esta lista já existe!"); 
        }
    }

    function deleteCurrentSheet() {
        if (confirm(`Tem certeza que deseja excluir a lista "${currentSheet}"?`)) {
            delete database[currentSheet];
            delete fundosPersonagens[currentSheet];
            saveData();
            
            const remaining = Object.keys(database);
            if (remaining.length > 0) currentSheet = remaining[0];
            init();
        }
    }

    function changeSheet() { 
        currentSheet = document.getElementById('sheetSelect').value; 
        init(); 
    }

    function convertFileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    async function addGibi(event) {
        event.preventDefault();
        
        const fileInput = document.getElementById('capaInput');
        let capaBase64 = "";

        if (fileInput.files && fileInput.files[0]) {
            capaBase64 = await convertFileToBase64(fileInput.files[0]);
        }

        database[currentSheet].push({
            capa: capaBase64,
            editora: document.getElementById('editora').value,
            categoria: document.getElementById('categoria').value,
            serie: document.getElementById('serie').value,
            numero: parseInt(document.getElementById('numero').value),
            data: document.getElementById('data').value,
            estado: document.getElementById('estado').value
        });

        saveData(); 
        updateCategoryFilterOptions();
        renderTable(); 
        document.getElementById('addGibiForm').reset();
    }

    function deleteGibi(index) {
        if (confirm("Remover este gibi?")) { 
            database[currentSheet].splice(index, 1); 
            if (editingIndex === index) editingIndex = null;
            saveData(); 
            updateCategoryFilterOptions();
            renderTable(); 
        }
    }

    // Inicia o modo de edição na linha selecionada
    function startEdit(index) {
        editingIndex = index;
        renderTable();
    }

    // Cancela o modo de edição
    function cancelEdit() {
        editingIndex = null;
        renderTable();
    }

    // Salva as alterações feitas na linha
    async function saveEdit(index) {
        const fileInput = document.getElementById(`editCapa_${index}`);
        let capaBase64 = database[currentSheet][index].capa;

        if (fileInput && fileInput.files && fileInput.files[0]) {
            capaBase64 = await convertFileToBase64(fileInput.files[0]);
        }

        database[currentSheet][index] = {
            capa: capaBase64,
            numero: parseInt(document.getElementById(`editNumero_${index}`).value),
            editora: document.getElementById(`editEditora_${index}`).value,
            categoria: document.getElementById(`editCategoria_${index}`).value,
            serie: document.getElementById(`editSerie_${index}`).value,
            data: document.getElementById(`editData_${index}`).value,
            estado: document.getElementById(`editEstado_${index}`).value
        };

        editingIndex = null;
        saveData();
        updateCategoryFilterOptions();
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody'); 
        const selectedFilter = document.getElementById('categoryFilter').value;
        tbody.innerHTML = '';

        if (!database[currentSheet]) return;

        let itemsToRender = database[currentSheet];
        if (selectedFilter !== "TODAS") {
            itemsToRender = itemsToRender.filter(item => item.categoria.trim() === selectedFilter);
        }

        // Se não estiver editando nenhuma linha, ordena por número normalmente
        if (editingIndex === null) {
            itemsToRender.sort((a, b) => a.numero - b.numero);
        }

        itemsToRender.forEach((item) => {
            const indexNoBanco = database[currentSheet].indexOf(item);
            
            // Verifica se esta linha está no modo de edição
            if (editingIndex === indexNoBanco) {
                tbody.innerHTML += `<tr>
                    <td class="capa-cell">
                        <input type="file" id="editCapa_${indexNoBanco}" accept="image/*" style="font-size:10px; width:70px;">
                    </td>
                    <td><input type="number" id="editNumero_${indexNoBanco}" value="${item.numero}"></td>
                    <td><input type="text" id="editEditora_${indexNoBanco}" value="${item.editora}"></td>
                    <td><input type="text" id="editCategoria_${indexNoBanco}" value="${item.categoria}"></td>
                    <td><input type="text" id="editSerie_${indexNoBanco}" value="${item.serie}"></td>
                    <td><input type="text" id="editData_${indexNoBanco}" value="${item.data}"></td>
                    <td><input type="text" id="editEstado_${indexNoBanco}" value="${item.estado}"></td>
                    <td class="actions-cell no-pdf">
                        <button class="btn-save" onclick="saveEdit(${indexNoBanco})">Salvar</button>
                        <button class="btn-cancel" onclick="cancelEdit()">X</button>
                    </td>
                </tr>`;
            } else {
                const capaHTML = item.capa 
                    ? `<img src="${item.capa}" class="capa-thumb" alt="Capa Nº ${item.numero}">`
                    : `<div class="capa-placeholder">Sem capa</div>`;

                tbody.innerHTML += `<tr>
                    <td class="capa-cell">${capaHTML}</td>
                    <td class="numero-cell">Nº ${item.numero}</td>
                    <td>${item.editora}</td>
                    <td>${item.categoria}</td>
                    <td>${item.serie}</td>
                    <td>${item.data}</td>
                    <td>${item.estado}</td>
                    <td class="actions-cell no-pdf">
                        <button class="btn-edit" onclick="startEdit(${indexNoBanco})">Editar</button>
                        <button class="btn-delete" onclick="deleteGibi(${indexNoBanco})">Excluir</button>
                    </td>
                </tr>`;
            }
        });
    }

    function exportToPDF() {
        const element = document.getElementById('pdfContent');
        const actionCols = document.querySelectorAll('.no-pdf');
        
        actionCols.forEach(el => el.style.display = 'none');

        const opt = { 
            margin: 8, 
            filename: `Colecao_${currentSheet}.pdf`, 
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 }, 
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
        };

        html2pdf().set(opt).from(element).save().then(() => { 
            actionCols.forEach(el => el.style.display = ''); 
        });
    }

    init();
</script>
</body>
</html>
